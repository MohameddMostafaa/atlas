name: Atlas CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas_app
          POSTGRES_PASSWORD: atlas_test_password
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas_app -d atlas_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://atlas_app:atlas_test_password@localhost:5432/atlas_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://atlas_app:atlas_test_password@localhost:5432/atlas_test
          TEST_DATABASE_URL: postgresql+psycopg://atlas_app:atlas_test_password@localhost:5432/atlas_test
        run: pytest

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t atlas-api:ci .


  docker-integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Check running containers
        run: docker compose ps

      - name: Run database migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Check API health
        run: curl --fail http://127.0.0.1:8000/health

      - name: Check API root
        run: curl --fail http://127.0.0.1:8000/

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
