services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_app -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/mohameddmostafaa/atlas:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://atlas_app:${POSTGRES_PASSWORD}@postgres:5432/atlas
    ports:
      - "80:8000"

volumes:
  postgres_data:
