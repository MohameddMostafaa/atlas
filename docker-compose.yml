services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas_app
      POSTGRES_PASSWORD: atlas_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_app -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://atlas_app:atlas_password@postgres:5432/atlas
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
